[package]
name = "collector"
version = "0.6.1"
description = "A small tray app"
edition = "2021"

[lib]
name = "collector_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query", "form"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
minisign-verify = "0.3.0"
self-replace = "1.5.1"
sha2 = "0.11.1"
base64 = "0.23.1"
